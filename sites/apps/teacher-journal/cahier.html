<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cahier de bord — Classe</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --border:#dde2ea;
  --text:#232a35; --text-muted:#6b7686; --primary:#3d6bf0; --primary-dark:#2c52c9;
  --accent:#0fae8a; --danger:#e0503c; --warn:#e0a13c;
  --radius:10px; --shadow:0 1px 3px rgba(20,30,60,.08), 0 1px 2px rgba(20,30,60,.06);
  --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;font-family:var(--font);background:var(--bg);color:var(--text);}
body{display:flex;min-height:100vh;font-size:14px;}
a{color:var(--primary);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c6cedb;border-radius:6px;}

/* ---------- Gate ---------- */
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#3d6bf0,#0fae8a);display:flex;align-items:center;justify-content:center;z-index:9999;}
#gate .card{background:#fff;border-radius:16px;padding:36px 32px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;}
#gate h1{font-size:20px;margin:0 0 4px;}
#gate p{color:var(--text-muted);font-size:13px;margin:0 0 20px;}
#gate input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;}
#gate button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;}
#gate .err{color:var(--danger);font-size:12px;min-height:16px;margin-bottom:8px;}
#gate .small{font-size:11px;color:var(--text-muted);margin-top:14px;}

/* ---------- Shell ---------- */
#sidebar{width:220px;flex:none;background:#1c2333;color:#cdd6e8;display:flex;flex-direction:column;padding:16px 0;}
#sidebar .brand{padding:0 18px 16px;font-weight:700;font-size:16px;color:#fff;border-bottom:1px solid #2c3550;margin-bottom:10px;}
#sidebar .brand small{display:block;font-weight:400;font-size:11px;color:#8b96b3;margin-top:2px;}
#sidebar nav{flex:1;overflow-y:auto;}
#sidebar a{display:flex;align-items:center;gap:10px;padding:10px 18px;color:#aab4cc;text-decoration:none;font-size:13.5px;border-left:3px solid transparent;}
#sidebar a:hover{background:#242c42;color:#fff;}
#sidebar a.active{background:#242c42;color:#fff;border-left-color:var(--accent);font-weight:600;}
#sidebar .foot{padding:10px 18px;border-top:1px solid #2c3550;display:flex;flex-direction:column;gap:6px;}
#sidebar .foot button{background:none;border:1px solid #3a4361;color:#aab4cc;border-radius:6px;padding:6px 8px;font-size:11.5px;}
#sidebar .foot button:hover{color:#fff;border-color:#5a6690;}

#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;}
#topbar h2{font-size:16px;margin:0;}
#topbar .actions{display:flex;gap:8px;}
#content{flex:1;overflow-y:auto;padding:22px;}

.btn{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-danger{color:var(--danger);border-color:#f0c4bc;}
.btn-danger:hover{background:#fdf1ee;}
.btn-sm{padding:4px 8px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px;}
.grid{display:grid;gap:14px;}
.row{display:flex;gap:10px;align-items:center;}
.spacer{flex:1;}
label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);
}
textarea{resize:vertical;}
.field{margin-bottom:12px;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;}
.badge-fait{background:#e3f7ef;color:#0f8a63;}
.badge-afaire{background:#fdeee0;color:#c9701a;}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.kpi{padding:16px;}
.kpi .num{font-size:26px;font-weight:700;}
.kpi .lbl{font-size:12px;color:var(--text-muted);}

/* Emploi du temps grid */
.edt-grid{display:grid;grid-template-columns:70px repeat(5,1fr);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
.edt-grid .hcell{background:var(--surface-2);font-weight:700;font-size:12.5px;padding:8px;text-align:center;border-bottom:1px solid var(--border);border-left:1px solid var(--border);}
.edt-grid .hcell:first-child{border-left:none;}
.edt-time{padding:6px;font-size:11px;color:var(--text-muted);text-align:right;border-top:1px solid var(--border);}
.edt-cell{min-height:30px;border-top:1px solid var(--border);border-left:1px solid var(--border);position:relative;padding:2px;}
.edt-slot{border-radius:6px;padding:5px 7px;font-size:11.5px;font-weight:600;color:#fff;cursor:pointer;margin-bottom:2px;line-height:1.25;}
.edt-slot small{display:block;font-weight:400;opacity:.9;font-size:10px;}
.edt-add{width:100%;height:100%;min-height:26px;background:transparent;border:1px dashed transparent;color:var(--text-muted);font-size:16px;border-radius:6px;}
.edt-cell:hover .edt-add{border-color:#c6cedb;}

/* Cahier journal */
.journal-week{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.journal-day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-height:200px;display:flex;flex-direction:column;}
.journal-day .dhead{padding:9px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;background:var(--surface-2);border-radius:var(--radius) var(--radius) 0 0;display:flex;justify-content:space-between;align-items:center;}
.journal-day .dhead span.date{font-weight:400;color:var(--text-muted);font-size:11.5px;}
.journal-day .dbody{padding:8px;flex:1;display:flex;flex-direction:column;gap:7px;}
.seance-card{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--primary);border-radius:8px;padding:7px 9px;cursor:grab;}
.seance-card.done{opacity:.65;}
.seance-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.seance-card .mat{font-weight:700;font-size:12.5px;}
.seance-card .dom{font-size:11px;color:var(--text-muted);margin-top:1px;}
.seance-card .actions{display:flex;gap:3px;margin-top:5px;}
.seance-card .actions button{border:none;background:none;color:var(--text-muted);font-size:11px;padding:2px 4px;border-radius:4px;}
.seance-card .actions button:hover{background:var(--surface-2);color:var(--text);}
.dbody.dragover{background:#eef3ff;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,25,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:500;}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-bottom:40px;}
.modal .mhead{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal .mhead h3{margin:0;font-size:16px;}
.modal .mbody{padding:20px;max-height:70vh;overflow-y:auto;}
.modal .mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.mclose{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

.richbar{display:flex;gap:4px;border:1px solid var(--border);border-bottom:none;border-radius:7px 7px 0 0;background:var(--surface-2);padding:4px;}
.richbar button{border:none;background:none;padding:4px 8px;border-radius:5px;font-size:12px;font-weight:700;}
.richbar button:hover{background:#fff;}
.rich{min-height:90px;border:1px solid var(--border);border-radius:0 0 7px 7px;padding:8px 10px;background:#fff;overflow-y:auto;}
.rich:focus{outline:2px solid var(--primary);outline-offset:-1px;}

.atelier-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;padding:8px;background:var(--surface-2);border-radius:8px;}
.phase-row{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin-bottom:8px;}
.phase-row textarea{grid-column:1/3;}

table.tbl{width:100%;border-collapse:collapse;background:var(--surface);}
table.tbl th,table.tbl td{border:1px solid var(--border);padding:8px 10px;font-size:12.5px;text-align:left;}
table.tbl th{background:var(--surface-2);font-weight:700;}
table.tbl tr:hover td{background:#fafbfd;}

.empty{padding:40px;text-align:center;color:var(--text-muted);}
.empty .big{font-size:30px;margin-bottom:6px;}

.list-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;object-fit:cover;}
.trombi{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;}
.trombi .tcard{text-align:center;padding:12px 8px;}
.trombi .avatar{width:56px;height:56px;font-size:18px;margin:0 auto 8px;}

.tag-cycle{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:#e6ecff;color:var(--primary-dark);}

.vol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px;}
.vol-item{padding:10px 12px;border-radius:8px;background:var(--surface-2);border-left:4px solid var(--primary);}
.vol-item .vnum{font-size:18px;font-weight:700;}
.vol-item .vlbl{font-size:11.5px;color:var(--text-muted);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.day-view .seance-card{margin-bottom:10px;cursor:pointer;}
.hint{font-size:12.5px;color:var(--text-muted);}

/* Mobile */
#menu-toggle{display:none;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;margin-right:10px;}
@media (max-width:820px){
  #menu-toggle{display:inline-flex;}
  #sidebar{position:fixed;inset:0 auto 0 0;z-index:400;transform:translateX(-100%);transition:transform .2s ease;width:240px;}
  #sidebar.open{transform:translateX(0);}
  #sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:350;}
  #sidebar-backdrop.show{display:block;}
  .journal-week{grid-template-columns:1fr;}
  .edt-grid{grid-template-columns:54px repeat(5,minmax(90px,1fr));overflow-x:auto;}
  .two-col,.three-col{grid-template-columns:1fr;}
  .atelier-row,.phase-row{grid-template-columns:1fr;}
}

/* Print */
#print-area{display:none;}
@media print{
  #sidebar,#topbar,.no-print,#menu-toggle,#sidebar-backdrop{display:none !important;}
  #content{display:none !important;}
  #print-area{display:block !important;padding:0;margin:0;}
  body{background:#fff;}
  @page{margin:12mm;}
}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>📘 Cahier de bord</h1>
    <p id="gate-sub">Connectez-vous pour synchroniser vos données sur tous vos appareils.</p>
    <div id="gate-err" class="err"></div>
    <div style="display:flex;gap:6px;margin-bottom:12px;">
      <button type="button" id="gate-tab-login" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--primary);color:#fff;font-weight:600;">Connexion</button>
      <button type="button" id="gate-tab-signup" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-weight:600;">Inscription</button>
    </div>
    <input type="email" id="gate-email" placeholder="Email" autocomplete="email">
    <input type="password" id="gate-pass" placeholder="Mot de passe" autocomplete="current-password">
    <button id="gate-btn">Se connecter</button>
    <button id="gate-offline" type="button" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--primary);font-weight:600;margin-top:8px;">Continuer hors ligne (localStorage)</button>
    <div class="small" id="gate-hint">Cloud optionnel — hors ligne, vos données restent dans ce navigateur.</div>
  </div>
</div>

<div id="sidebar-backdrop"></div>
<div id="sidebar" class="hidden">
  <div class="brand">📘 Cahier de bord<small id="brand-sub">Classe</small></div>
  <nav id="nav"></nav>
  <div class="foot">
    <div id="user-email" style="font-size:11px;color:#8b96b3;padding:2px 0 4px;word-break:break-all;"></div>
    <button id="btn-export-json">💾 Exporter (JSON)</button>
    <button id="btn-import-json">📂 Importer</button>
    <button id="btn-logout">🚪 Se déconnecter</button>
  </div>
</div>

<div id="main" class="hidden">
  <div id="topbar">
    <div class="row" style="gap:0;">
      <button id="menu-toggle" type="button" aria-label="Menu">☰</button>
      <h2 id="page-title">Accueil</h2>
    </div>
    <div class="actions" id="page-actions"></div>
    <div id="sync-status" style="font-size:11px;color:var(--text-muted);margin-left:12px;white-space:nowrap;">•</div>
  </div>
  <div id="content"></div>
</div>

<div id="print-area"></div>
<input type="file" id="file-import" accept="application/json" class="hidden">

<script>
(function(){
"use strict";

/* =========================================================
   UTILS
   ========================================================= */
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
const uid = ()=> 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function isoDate(d){ const z = new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function startOfWeek(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function addDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt; }
function fmtFR(d){ return d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}); }
function fmtShort(d){ return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
const MATIERE_COLORS = {
  'Français':'#3d6bf0','Mathématiques':'#e0503c','EPS':'#0fae8a','Arts plastiques':'#c04ec2',

  'Mobiliser le langage':'#3d6bf0','Agir, s\'exprimer, comprendre à travers l\'activité physique':'#0fae8a',
  'Agir, s\'exprimer, comprendre à travers les activités artistiques':'#c04ec2',
  'Construire les premiers outils pour structurer sa pensée':'#e0503c','Explorer le monde':'#2c9e5e'
};
function colorFor(mat){ return MATIERE_COLORS[mat] || '#4a5a8a'; }
const NIVEAUX_CYCLE = {
  'TPS':'Cycle 1 (PS-MS-GS)','PS':'Cycle 1 (PS-MS-GS)','MS':'Cycle 1 (PS-MS-GS)','GS':'Cycle 1 (PS-MS-GS)',
  'CP':'Cycle 2 (CP-CE1-CE2)','CE1':'Cycle 2 (CP-CE1-CE2)','CE2':'Cycle 2 (CP-CE1-CE2)',
  'CM1':'Cycle 3 (CM1-CM2-6e)','CM2':'Cycle 3 (CM1-CM2-6e)','6e':'Cycle 3 (CM1-CM2-6e)'
};
function cycleFromNiveaux(niveaux){
  const counts = {};
  (niveaux||[]).forEach(n=>{ const c=NIVEAUX_CYCLE[n]; if(c) counts[c]=(counts[c]||0)+1; });
  const best = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  return best ? best[0] : 'Cycle 2 (CP-CE1-CE2)';
}
function activeDays(){
  const cfg = (STORE.data && STORE.data.config) || {};
  const jours = Array.isArray(cfg.joursTravailles) ? cfg.joursTravailles : [0,1,2,3,4];
  return jours.slice().sort((a,b)=>a-b).filter(j=>j>=0 && j<=4);
}
function dayLabel(idx){ return DAYS_ALL[idx] || ''; }
function minsToLabel(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function toMin(hhmm){ const [h,m] = String(hhmm||'00:00').split(':').map(Number); return (h||0)*60+(m||0); }
function addMinLabel(hhmm, add){ let m = toMin(hhmm)+add; return minsToLabel(Math.min(m, 23*60+30)); }
function formatDuree(mins){
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return h+' h '+String(m).padStart(2,'0');
  if(h) return h+' h';
  return m+' min';
}
const PAUSE_MATIERES = ['Récréation','Cantine'];
function isPauseCreneau(c){ return !!c.exclureVolume || PAUSE_MATIERES.includes(c.matiere); }

/* =========================================================
   REFERENTIEL PROGRAMMES OFFICIELS (FR) — cycles 1/2/3
   Structure: REFERENTIEL[cycle][matiere][domaine] = { sousDomaines: {nom: [objectifs]} }
   ========================================================= */
function bloc(sousDomaines){ return { sousDomaines }; }
const REFERENTIEL = {
  "Cycle 1 (PS-MS-GS)": {
    "Mobiliser le langage": {
      "Oral": bloc({ "Échanger, s'exprimer": ["Oser entrer en communication","Comprendre et apprendre du vocabulaire nouveau","Pratiquer divers usages du langage oral (raconter, décrire, expliquer)"] , "Commencer à réfléchir sur la langue": ["Percevoir les similarités et différences de sons","Manipuler des syllabes"] }),
      "Écrit": bloc({ "Découvrir l'écrit": ["Écouter de l'écrit et comprendre","Découvrir la fonction de l'écrit"], "Premiers essais d'écriture": ["Copier en écriture cursive","Reconnaître les lettres de l'alphabet"] })
    },
    "Agir, s'exprimer, comprendre à travers l'activité physique": bloc({

    }),
    "Agir, s'exprimer, comprendre à travers les activités artistiques": bloc({
      "Les productions plastiques et visuelles": ["Dessiner, peindre, réaliser des compositions"],
      "Univers sonores": ["Chanter, explorer des instruments"],
      "Le spectacle vivant": ["Danser, mimer, exprimer des sentiments"]
    }),
    "Construire les premiers outils pour structurer sa pensée": bloc({
      "Découvrir les nombres et leurs utilisations": ["Utiliser les nombres pour désigner une position","Construire le nombre pour exprimer des quantités","Dénombrer une quantité"],

    }),
    "Explorer le monde": bloc({

    })
  },
  "Cycle 2 (CP-CE1-CE2)": {
    "Français": {

/* =========================================================
   STORE — persistence, backups, import/export
   ========================================================= */
const LS_KEY = 'cahierbord.v1';
const LS_BACKUP_PREFIX = 'cahierbord.backup.';
const LS_AUTH = 'cahierbord.auth';

function defaultData(){
  return {
    schema: 2,
    config: {
      classeNom: 'Ma classe',
      niveaux: ['CE1','CE2'],
      passwordHash: null,
      joursTravailles: [0,1,2,3,4],
      heureDebut: '08:30',
      heureFin: '16:30',
      slotStep: 30,
      cycleDefaut: 'Cycle 2 (CP-CE1-CE2)'
    },
    classes: [{ id: uid(), nom:'Ma classe', niveaux:['CE1','CE2'] }],
    eleves: [],
    creneaux: [],
    seances: [],
    programmations: [],
    fiches: [],
    presences: [],
    rdv: []
  };
}

const STORE = { data: null };

function migrateData(data){
  const base = defaultData();
  const d = Object.assign(base, data||{});
  d.config = Object.assign({}, base.config, data && data.config ? data.config : {});
  if(!Array.isArray(d.config.joursTravailles) || !d.config.joursTravailles.length) d.config.joursTravailles = [0,1,2,3,4];
  if(!d.config.heureDebut) d.config.heureDebut = '08:30';
  if(!d.config.heureFin) d.config.heureFin = '16:30';
  if(!d.config.slotStep) d.config.slotStep = 30;
  if(!d.config.cycleDefaut) d.config.cycleDefaut = cycleFromNiveaux(d.config.niveaux);
  if(!Array.isArray(d.rdv)) d.rdv = [];
  if(!Array.isArray(d.classes)) d.classes = base.classes;
  d.schema = 2;
  return d;
}

/* Local cache (offline fluidity) — cloud est la source de vérité */
function loadLocalCache(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    STORE.data = migrateData(raw ? JSON.parse(raw) : defaultData());
  }catch(e){
    console.error('Erreur de lecture du cache local.', e);
    STORE.data = defaultData();
  }
}
function writeLocalCache(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STORE.data)); }catch(e){}
}
function rotateBackups(){
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith(LS_BACKUP_PREFIX)) keys.push(k); }
    keys.sort();
    while(keys.length >= 6){ localStorage.removeItem(keys.shift()); }
    localStorage.setItem(LS_BACKUP_PREFIX+Date.now(), localStorage.getItem(LS_KEY)||'');
  }catch(e){}
}

/* Sync état */
const SYNC = { user:null, saving:false, lastError:null };
function setSyncStatus(text, color){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = text;
  el.style.color = color || 'var(--text-muted)';
}

async function pushToCloud(){
  if(!SYNC.user || !window.__supabase) return;
  SYNC.saving = true;
  setSyncStatus('⟳ Synchronisation…');
  try{
    const { error } = await window.__supabase
      .from('user_workspaces')
      .upsert({ user_id: SYNC.user.id, data: STORE.data }, { onConflict: 'user_id' });
    if(error) throw error;
    SYNC.lastError = null;
    setSyncStatus('✓ Synchronisé', 'var(--accent)');
  }catch(e){
    console.error('Sync error', e);
    SYNC.lastError = e;
    setSyncStatus('⚠ Erreur de synchronisation', 'var(--danger)');
  }finally{
    SYNC.saving = false;
  }
}
const debouncedPush = debounce(pushToCloud, 700);

const persist = debounce(function(){
  writeLocalCache();
  rotateBackups();
}, 400);
function save(){
  persist();
  debouncedPush();
}

async function loadFromCloud(){
  if(!SYNC.user || !window.__supabase) return;
  setSyncStatus('⟳ Chargement…');
  let row=null, error=null;
  try{
    const res = await Promise.race([
      window.__supabase.from('user_workspaces').select('data').eq('user_id', SYNC.user.id).maybeSingle(),
      new Promise((_,rej)=> setTimeout(()=>rej(new Error('timeout')), 6000)),
    ]);
    row = res.data; error = res.error;
  }catch(e){
    console.error(e);
    setSyncStatus('⚠ Hors ligne (cache local)', 'var(--warn)');
    return;
  }
  if(error){
    console.error(error);
    setSyncStatus('⚠ Chargement échoué', 'var(--danger)');
    // fallback: garder le cache local
    return;
  }
  if(row && row.data && typeof row.data==='object' && Object.keys(row.data).length){
    STORE.data = migrateData(row.data);
    writeLocalCache();
    setSyncStatus('✓ Synchronisé', 'var(--accent)');
  }else{
    // Aucune ligne cloud : migration éventuelle du localStorage puis push
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      try{ STORE.data = migrateData(JSON.parse(raw)); }catch(e){ STORE.data = defaultData(); }
    }else{
      STORE.data = defaultData();
    }
    // Nettoyer les vestiges du mot de passe local
    if(STORE.data.config) STORE.data.config.passwordHash = null;
    await pushToCloud();
  }
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(STORE.data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cahier-de-bord-'+isoDate(new Date())+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed!=='object') throw new Error('format invalide');
      STORE.data = migrateData(Object.assign(defaultData(), parsed));
      writeLocalCache();
      rotateBackups();
      pushToCloud();
      alert('Import réussi.');
      render();
    }catch(e){ alert('Fichier invalide : '+e.message); }
  };
  reader.readAsText(file);
}

let GATE_MODE = 'login';
function setGateMode(mode){
  GATE_MODE = mode;
  const login = $('#gate-tab-login'), signup = $('#gate-tab-signup');
  const btn = $('#gate-btn');
  if(mode==='signup'){
    signup.style.background='var(--primary)'; signup.style.color='#fff';
    login.style.background='#fff'; login.style.color='var(--text)';
    btn.textContent = "S'inscrire";

  }else{

    signup.style.background='#fff'; signup.style.color='var(--text)';
    btn.textContent = 'Se connecter';
    $('#gate-pass').setAttribute('autocomplete','current-password');
  }
  $('#gate-err').textContent='';
}

async function enterOffline(){
  SYNC.user = null;
  sessionStorage.setItem('cahierbord.offline','1');
  loadLocalCache();
  if(!STORE.data) STORE.data = defaultData();
  setSyncStatus('• Hors ligne', 'var(--text-muted)');
  showApp();
}
async function initGate(){
  setGateMode('login');
  $('#gate-tab-login').addEventListener('click', ()=> setGateMode('login'));
  $('#gate-tab-signup').addEventListener('click', ()=> setGateMode('signup'));
  $('#gate-btn').addEventListener('click', onGateSubmit);
  $('#gate-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') onGateSubmit(); });
  $('#gate-email').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#gate-pass').focus(); });
  const off = $('#gate-offline');
  if(off) off.addEventListener('click', ()=> enterOffline());

  if(sessionStorage.getItem('cahierbord.offline')==='1'){
    await enterOffline();
    return;
  }

  if(!window.__supabase){
    $('#gate-sub').textContent = 'Cloud indisponible — utilisez le mode hors ligne ou réessayez plus tard.';
    return;
  }

  try{
    const result = await Promise.race([
      window.__supabase.auth.getSession(),
      new Promise((_,rej)=> setTimeout(()=>rej(new Error('timeout')), 4000)),
    ]);
    const data = result.data;
    if(data.session && data.session.user){
      SYNC.user = data.session.user;
      await enterApp();
    }
  }catch(e){
    console.warn('[cahier] getSession failed', e);
    $('#gate-sub').textContent = 'Connexion cloud lente ou indisponible — vous pouvez continuer hors ligne.';
  }
  try{
    window.__supabase.auth.onAuthStateChange((event, session)=>{
      if(event==='SIGNED_OUT'){
        SYNC.user = null;
        showGate();
      }
    });
  }catch(e){ console.warn(e); }
}
async function onGateSubmit(){
  const email = $('#gate-email').value.trim();
  const pass = $('#gate-pass').value;
  const errEl = $('#gate-err');
  errEl.textContent='';
  if(!window.__supabase){ errEl.textContent = 'Cloud indisponible — utilisez « Continuer hors ligne ».'; return; }
  if(!email || !pass){ errEl.textContent = 'Email et mot de passe requis.'; return; }
  if(GATE_MODE==='signup' && pass.length < 6){ errEl.textContent = 'Mot de passe : 6 caractères minimum.'; return; }
  $('#gate-btn').disabled = true;
  try{
    if(GATE_MODE==='signup'){
      const { data, error } = await window.__supabase.auth.signUp({
        email, password: pass,
        options: { emailRedirectTo: window.location.origin + '/cahier.html' }
      });
      if(error) throw error;
      if(!data.session){
        errEl.style.color='var(--accent)';
        errEl.textContent = 'Compte créé. Vérifiez votre email pour confirmer, puis connectez-vous.';
        setGateMode('login');
        return;
      }
      SYNC.user = data.user;
      await enterApp();
    }else{
      const { data, error } = await window.__supabase.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
      SYNC.user = data.user;
      await enterApp();
    }
  }catch(e){
    errEl.style.color='var(--danger)';
    errEl.textContent = traduireErreurAuth(e.message || 'Erreur de connexion.');
  }finally{
    $('#gate-btn').disabled = false;
  }
}
function traduireErreurAuth(msg){
  const m = String(msg).toLowerCase();
  if(m.includes('invalid login')) return 'Email ou mot de passe incorrect.';
  if(m.includes('already registered') || m.includes('user already')) return 'Un compte existe déjà avec cet email.';
  if(m.includes('email not confirmed')) return 'Email non confirmé. Vérifiez votre boîte mail.';
  if(m.includes('password')) return 'Mot de passe invalide (6 caractères minimum).';
  if(m.includes('rate')) return 'Trop de tentatives, réessayez plus tard.';
  return msg;
}
async function enterApp(){
  loadLocalCache();       // affichage immédiat depuis cache
  showApp();
  await loadFromCloud();  // écrase avec la vérité cloud
  render();
}
function showGate(){
  $('#gate-pass').value='';
  $('#gate-err').textContent='';
  $('#sidebar').classList.add('hidden');
  $('#main').classList.add('hidden');
  $('#gate').classList.remove('hidden');

function showApp(){
  $('#gate').classList.add('hidden');

async function logout(){
  try{
    if(SYNC.saving) await pushToCloud();
  }catch(e){}
  sessionStorage.removeItem('cahierbord.offline');
  try{
    if(window.__supabase) await window.__supabase.auth.signOut();
  }catch(e){}
  SYNC.user = null;
  showGate();
}

function renderDashboard(root){
  const today = new Date();
  const wk = startOfWeek(today);
  const days = activeDays();
  const weekSeances = STORE.data.seances.filter(s=>{
    const d = new Date(s.date+'T12:00:00'); return d>=wk && d < addDays(wk,7);
  }).filter(s=>{
    const day = (new Date(s.date+'T12:00:00').getDay()+6)%7;
    return days.includes(day);
  });
  const done = weekSeances.filter(s=>s.statut==='fait').length;
  const nbEleves = STORE.data.eleves.length;
  const nbCreneaux = STORE.data.creneaux.length;
  const upcoming = (STORE.data.rdv||[]).filter(r=>r.date >= isoDate(today)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);

  root.innerHTML = `
    <div class="kpis">

      <div id="dash-days" class="journal-week" style="grid-template-columns:repeat(${days.length},1fr);"></div>
    </div>
    <div class="card card-pad">
      <div class="row" style="margin-bottom:8px;"><strong>Prochains RDV (Planner)</strong><span class="spacer"></span><a href="#planner" class="btn btn-sm">Voir le planner →</a></div>
      ${upcoming.length ? `<div>${upcoming.map(r=>`<div class="list-item" style="padding-left:0;padding-right:0;"><div style="flex:1;"><strong>${esc(r.titre)}</strong><div class="hint">${fmtShort(new Date(r.date+'T12:00:00'))} · ${esc(r.categorie||'RDV')}</div></div><div class="chip">${esc(r.duree||'?')} min</div></div>`).join('')}</div>` : `<div class="hint">Aucun rendez-vous à venir. Ajoutez-en dans le Planner (réunions, APC, formations…).</div>`}
    </div>
  `;

    const date = addDays(wk, dayIdx);

    return `<div class="journal-day">
      <div class="dhead">${dayLabel(dayIdx)} <span class="date">${fmtShort(date)}</span></div>
      <div class="dbody">${list.length? list.map(s=>seanceCardHTML(s)).join('') : '<div style="color:var(--text-muted);font-size:12px;padding:6px;">Aucune séance</div>'}</div>
    </div>`;
  }).join('');
}

function edtBounds(){
  const cfg = STORE.data.config;
  return {
    start: toMin(cfg.heureDebut || '08:30'),
    end: toMin(cfg.heureFin || '16:30'),
    step: Number(cfg.slotStep || 30)
  };
}

function computeVolumeHoraire(){
  const totals = {};
  let total = 0;
  STORE.data.creneaux.forEach(c=>{
    if(isPauseCreneau(c)) return;
    // Ateliers parallèles : ne compter qu'une fois par jour/horaire (premier créneau)
    if(c.atelier){
      const parallel = STORE.data.creneaux.filter(x=>x.jour===c.jour && x.heureDebut===c.heureDebut && x.heureFin===c.heureFin && x.atelier);
      if(parallel[0] && parallel[0].id !== c.id) return;
    }
    const dur = Math.max(0, toMin(c.heureFin)-toMin(c.heureDebut));
    totals[c.matiere] = (totals[c.matiere]||0) + dur;
    total += dur;
  });
  return { totals, total };
}

function renderEDT(root){
  $('#page-actions').innerHTML = `<button class="btn" id="btn-toggle-vol">📊 Volume horaire</button><button class="btn" id="btn-print-edt">🖨️ Export PDF</button>`;
  const days = activeDays();
  const {start:SLOT_START, end:SLOT_END, step:SLOT_STEP} = edtBounds();
  const rows = [];
  for(let m=SLOT_START; m<SLOT_END; m+=SLOT_STEP) rows.push(m);
  const vol = computeVolumeHoraire();

  root.innerHTML = `<div class="card card-pad" style="margin-bottom:14px;">
      <div class="row"><span class="hint">Clique sur un créneau vide pour l'ajouter, clique sur un créneau existant pour le modifier. Glisse-dépose pour le déplacer (comme sur Teetsh).</span></div>
    </div>
    <div class="card card-pad hidden" id="vol-panel" style="margin-bottom:14px;">
      <div class="row"><strong>Volume horaire hebdomadaire</strong><span class="spacer"></span><span class="chip">${formatDuree(vol.total)}</span></div>
      <div class="vol-grid">${Object.keys(vol.totals).length ? Object.entries(vol.totals).sort((a,b)=>b[1]-a[1]).map(([mat,mins])=>`
        <div class="vol-item" style="border-left-color:${colorFor(mat)}"><div class="vnum">${formatDuree(mins)}</div><div class="vlbl">${esc(mat)}</div></div>`).join('') : '<div class="hint">Aucun créneau pédagogique pour le moment.</div>'}</div>
    </div>
    <div class="edt-grid" id="edt-grid" style="grid-template-columns:70px repeat(${days.length},1fr);">
      <div class="hcell"></div>
      ${days.map(d=>`<div class="hcell">${dayLabel(d)}</div>`).join('')}
    </div>`;
  const grid = $('#edt-grid', root);
  rows.forEach(m=>{
    const timeCell = document.createElement('div');
    timeCell.className='edt-time'; timeCell.textContent = minsToLabel(m);
    grid.appendChild(timeCell);
    days.forEach(dayIdx=>{
      const cell = document.createElement('div');
      cell.className='edt-cell';
      cell.dataset.jour = String(dayIdx);
      cell.dataset.debut = minsToLabel(m);
      const slots = STORE.data.creneaux.filter(c=> c.jour===dayIdx && toMin(c.heureDebut)===m);
      if(slots.length){
        const main = slots[0];
        const dur = toMin(main.heureFin)-toMin(main.heureDebut);
        const rowspan = Math.max(1, Math.round(dur/SLOT_STEP));
        cell.style.gridRow = 'span '+rowspan;
        cell.innerHTML = slots.map(slot=>`<div class="edt-slot" draggable="true" data-id="${slot.id}" style="background:${colorFor(slot.matiere)}">${esc(slot.matiere)}${slot.atelier?' · atelier':''}<small>${slot.heureDebut}–${slot.heureFin}${slot.label?' · '+esc(slot.label):''}</small></div>`).join('');
        $$('.edt-slot', cell).forEach(el=>{
          el.addEventListener('click', ()=>openCreneauModal(STORE.data.creneaux.find(c=>c.id===el.dataset.id)));
          el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', el.dataset.id); e.stopPropagation(); });
        });
      }else{
        const overlapped = STORE.data.creneaux.some(c=> c.jour===dayIdx && toMin(c.heureDebut) < m && toMin(c.heureFin) > m);
        if(overlapped){ cell.style.display='none'; }
        else{
          cell.innerHTML = `<button class="edt-add">+</button>`;
          cell.querySelector('.edt-add').addEventListener('click', ()=>openCreneauModal(null, dayIdx, minsToLabel(m)));
        }
      }
      cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.style.outline='2px dashed var(--primary)'; });
      cell.addEventListener('dragleave', ()=> cell.style.outline='');
      cell.addEventListener('drop', e=>{
        e.preventDefault(); cell.style.outline='';
        const id = e.dataTransfer.getData('text/plain');
        const slot = STORE.data.creneaux.find(c=>c.id===id);
        if(!slot) return;
        const dur = toMin(slot.heureFin)-toMin(slot.heureDebut);
        slot.jour = Number(cell.dataset.jour);
        slot.heureDebut = cell.dataset.debut;
        slot.heureFin = addMinLabel(slot.heureDebut, dur);
        save(); render();
      });
      grid.appendChild(cell);
    });
  });
  $('#btn-print-edt').addEventListener('click', printEDT);
  $('#btn-toggle-vol').addEventListener('click', ()=> $('#vol-panel').classList.toggle('hidden'));
}

function openCreneauModal(slot, dayIdx, startLabel){
  const isEdit = !!slot;
  const days = activeDays();
  const matieres = Object.keys(MATIERE_COLORS);
  const body = `
    <div class="two-col">
      <div class="field"><label>Jour</label><select id="c-jour">${days.map(i=>`<option value="${i}" ${((slot?slot.jour:dayIdx)===i)?'selected':''}>${dayLabel(i)}</option>`).join('')}</select></div>
      <div class="field"><label>Matière</label>
        <select id="c-mat">${matieres.map(m=>`<option ${slot&&slot.matiere===m?'selected':''}>${m}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Heure de début</label><input type="time" id="c-debut" value="${slot?slot.heureDebut:(startLabel||STORE.data.config.heureDebut||'08:30')}"></div>
      <div class="field"><label>Heure de fin</label><input type="time" id="c-fin" value="${slot?slot.heureFin:addMinLabel(startLabel||STORE.data.config.heureDebut||'08:30', STORE.data.config.slotStep||30)}"></div>
    </div>
    <div class="field"><label>Libellé (optionnel)</label><input type="text" id="c-label" value="${esc(slot&&slot.label||'')}" placeholder="ex : Rituels, Ateliers..."></div>
    <div class="field"><label><input type="checkbox" id="c-atelier" ${slot&&slot.atelier?'checked':''} style="width:auto;margin-right:6px;">Atelier (ne pas compter en double dans le volume horaire)</label></div>
    <div class="field"><label><input type="checkbox" id="c-exclure" ${slot&&slot.exclureVolume?'checked':''} style="width:auto;margin-right:6px;">Ne pas compter dans le volume horaire</label></div>
    <p class="hint">Astuce Teetsh : définis ici la trame (libellé) qui sera reprise lors de la génération du cahier journal.</p>
  `;
  const footExtra = isEdit ? `<button class="btn btn-danger" id="c-del">Supprimer</button>` : '';
  openModal('Créneau', body, footExtra, ()=>{
    const jour = Number($('#c-jour').value);
    const heureDebut = $('#c-debut').value, heureFin = $('#c-fin').value;
    if(toMin(heureFin) <= toMin(heureDebut)){ alert("L'heure de fin doit être après l'heure de début."); return false; }
    const payload = {
      jour, matiere: $('#c-mat').value, heureDebut, heureFin, label: $('#c-label').value,
      couleur: colorFor($('#c-mat').value),
      atelier: $('#c-atelier').checked,
      exclureVolume: $('#c-exclure').checked
    };
    if(isEdit){ Object.assign(slot, payload); }
    else{ STORE.data.creneaux.push(Object.assign({id:uid()}, payload)); }
    save(); render();
    return true;
  }, isEdit ? ()=>{
    if(confirm('Supprimer ce créneau ?')){
      STORE.data.creneaux = STORE.data.creneaux.filter(c=>c.id!==slot.id);
      save(); closeModal(); render();
    }
  } : null, 'c-del');
}

function openModal(title, bodyHTML, footExtraHTML, onSave, onExtraClick, extraId){
  closeModal();
  const wrap = document.createElement('div');
  wrap.className='modal-backdrop'; wrap.id='modal-backdrop';
  wrap.innerHTML = `<div class="modal">
    <div class="mhead"><h3>${esc(title)}</h3><button class="mclose" id="modal-close">×</button></div>
    <div class="mbody">${bodyHTML}</div>
    <div class="mfoot">${footExtraHTML||''}<button class="btn" id="modal-cancel">Annuler</button><button class="btn btn-primary" id="modal-save">Enregistrer</button></div>
  </div>`;
  document.body.appendChild(wrap);
  $('#modal-close').addEventListener('click', closeModal);
  $('#modal-cancel').addEventListener('click', closeModal);
  $('#modal-save').addEventListener('click', ()=>{ const ok = onSave(); if(ok!==false) closeModal(); });
  if(extraId && onExtraClick){ const el = document.getElementById(extraId); if(el) el.addEventListener('click', onExtraClick); }
  wrap.addEventListener('mousedown', e=>{ if(e.target===wrap) closeModal(); });
}
function closeModal(){ const el = $('#modal-backdrop'); if(el) el.remove(); }

/* =========================================================
   CAHIER JOURNAL
   ========================================================= */
let journalWeekStart = startOfWeek(new Date());
let journalView = 'semaine'; // semaine | jour
let journalDayOffset = 0; // index in activeDays()

function renderJournal(root){
  $('#page-actions').innerHTML = `<button class="btn" id="btn-gen-week">🔄 Générer depuis l'EDT</button><button class="btn" id="btn-print-journal">🖨️ Export PDF</button>`;
  const days = activeDays();
  if(journalDayOffset >= days.length) journalDayOffset = 0;
  root.innerHTML = `
    <div class="tabs">
      <button class="btn btn-sm ${journalView==='semaine'?'btn-primary':''}" data-jview="semaine">Vue semaine</button>
      <button class="btn btn-sm ${journalView==='jour'?'btn-primary':''}" data-jview="jour">Vue jour</button>
    </div>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn btn-sm" id="wk-prev">←</button>
      <strong id="wk-label" style="min-width:220px;text-align:center;"></strong>
      <button class="btn btn-sm" id="wk-next">→</button>
      <span class="spacer"></span>
      <button class="btn btn-sm" id="wk-dup">📋 Dupliquer la semaine →</button>
    </div>
    <div id="journal-body"></div>
  `;
  $$('[data-jview]', root).forEach(b=> b.addEventListener('click', ()=>{ journalView=b.dataset.jview; renderJournal(root); }));
  $('#wk-prev').addEventListener('click', ()=>{
    if(journalView==='jour'){
      journalDayOffset--;
      if(journalDayOffset < 0){ journalWeekStart = addDays(journalWeekStart,-7); journalDayOffset = activeDays().length-1; }
    } else journalWeekStart = addDays(journalWeekStart,-7);
    renderJournal(root);
  });
  $('#wk-next').addEventListener('click', ()=>{
    if(journalView==='jour'){
      journalDayOffset++;
      if(journalDayOffset >= activeDays().length){ journalWeekStart = addDays(journalWeekStart,7); journalDayOffset = 0; }
    } else journalWeekStart = addDays(journalWeekStart,7);
    renderJournal(root);
  });
  $('#btn-gen-week').addEventListener('click', ()=>{ generateWeekFromEDT(journalWeekStart); renderJournal(root); });
  $('#btn-print-journal').addEventListener('click', ()=>printJournal(journalWeekStart));
  $('#wk-dup').addEventListener('click', ()=>{
    duplicateWeek(journalWeekStart, addDays(journalWeekStart,7));
    journalWeekStart = addDays(journalWeekStart,7);
    renderJournal(root);
  });

  const body = $('#journal-body', root);
  if(journalView==='jour'){
    const dayIdx = days[journalDayOffset];
    const date = addDays(journalWeekStart, dayIdx);
    const iso = isoDate(date);
    $('#wk-label').textContent = dayLabel(dayIdx) + ' ' + fmtShort(date);
    body.className = 'day-view';
    const list = STORE.data.seances.filter(s=>s.date===iso).sort(seanceSort);
    body.innerHTML = `<div class="card card-pad">
      <div class="row" style="margin-bottom:10px;"><strong>Séances du jour</strong><span class="spacer"></span><button class="btn btn-sm btn-primary" id="add-day">+ Ajouter</button></div>
      ${list.length? list.map(s=>seanceCardHTML(s,true)).join('') : '<div class="hint">Aucune séance. Générez-les depuis l’EDT ou ajoutez-en.</div>'}
    </div>`;
    $('#add-day').addEventListener('click', ()=> openSeanceModal(null, iso));
    bindSeanceCards(body, root);
  } else {
    $('#wk-label').textContent = 'Semaine du ' + fmtShort(journalWeekStart);
    body.innerHTML = `<div class="journal-week" id="journal-week" style="grid-template-columns:repeat(${days.length},1fr);"></div>`;
    const weekEl = $('#journal-week', body);
    weekEl.innerHTML = days.map(dayIdx=>{
      const date = addDays(journalWeekStart, dayIdx);
      const iso = isoDate(date);
      return `<div class="journal-day" data-date="${iso}">
        <div class="dhead">${dayLabel(dayIdx)} <span class="date">${fmtShort(date)}</span>
          <button class="btn btn-sm" data-add="${iso}" title="Ajouter une séance">+</button>
        </div>
        <div class="dbody" data-drop="${iso}"></div>
      </div>`;
    }).join('');

    $$('.journal-day', weekEl).forEach(dayEl=>{
      const iso = dayEl.dataset.date;
      const dbody = $('.dbody', dayEl);
      const list = STORE.data.seances.filter(s=>s.date===iso).sort((a,b)=>seanceSort(a,b));
      dbody.innerHTML = list.length? list.map(s=>seanceCardHTML(s)).join('') : '';
      bindSeanceCards(dbody, root);
      dbody.addEventListener('dragover', e=>{ e.preventDefault(); dbody.classList.add('dragover'); });
      dbody.addEventListener('dragleave', ()=> dbody.classList.remove('dragover'));
      dbody.addEventListener('drop', e=>{
        e.preventDefault(); dbody.classList.remove('dragover');
        const id = e.dataTransfer.getData('text/plain');
        const s = STORE.data.seances.find(x=>x.id===id);
        if(s){ s.date = iso; save(); renderJournal(root); }
      });
      $('[data-add]', dayEl).addEventListener('click', ()=> openSeanceModal(null, iso));
    });
  }
}
function bindSeanceCards(scope, root){
  $$('.seance-card', scope).forEach(card=>{
    const id = card.dataset.id;
    card.addEventListener('click', (e)=>{ if(e.target.closest('button')) return; openSeanceModal(STORE.data.seances.find(s=>s.id===id)); });
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', id); });
    $('[data-toggle]', card)?.addEventListener('click', e=>{ e.stopPropagation(); toggleSeanceStatut(id); renderJournal(root); });
    $('[data-dup]', card)?.addEventListener('click', e=>{ e.stopPropagation(); duplicateSeance(id); renderJournal(root); });
    $('[data-del]', card)?.addEventListener('click', e=>{ e.stopPropagation(); if(confirm('Supprimer cette séance ?')){ STORE.data.seances = STORE.data.seances.filter(s=>s.id!==id); save(); renderJournal(root);} });
  });
}
function seanceSort(a,b){
  const ta = a.heureDebut ? toMin(a.heureDebut) : (()=>{ const ca = STORE.data.creneaux.find(c=>c.id===a.creneauId); return ca? toMin(ca.heureDebut) : 999; })();
  const tb = b.heureDebut ? toMin(b.heureDebut) : (()=>{ const cb = STORE.data.creneaux.find(c=>c.id===b.creneauId); return cb? toMin(cb.heureDebut) : 999; })();
  return ta-tb;
}
function seanceCardHTML(s, detailed){
  const badge = s.statut==='fait' ? '<span class="chip badge-fait">✓ Fait</span>' : '<span class="chip badge-afaire">À faire</span>';
  const time = (s.heureDebut && s.heureFin) ? `${s.heureDebut}–${s.heureFin}` : '';
  const fiche = s.ficheId ? STORE.data.fiches.find(f=>f.id===s.ficheId) : null;
  return `<div class="seance-card ${s.statut==='fait'?'done':''}" draggable="true" data-id="${s.id}" style="border-left-color:${colorFor(s.matiere)}">
    <div class="top"><div><div class="mat">${esc(s.matiere)}${time?` <span class="hint">· ${time}</span>`:''}</div><div class="dom">${esc(s.domaine||'')}${s.sousDomaine?' · '+esc(s.sousDomaine):''}</div>${fiche?`<div class="hint">📝 ${esc(fiche.titre||'Fiche liée')}</div>`:''}${detailed && s.description?`<div style="font-size:12px;margin-top:6px;">${s.description}</div>`:''}</div>${badge}</div>
    <div class="actions">
      <button data-toggle title="Marquer fait/à faire">✓</button>
      <button data-dup title="Dupliquer">⧉</button>
      <button data-del title="Supprimer">🗑</button>
    </div>
  </div>`;
}
function toggleSeanceStatut(id){ const s = STORE.data.seances.find(x=>x.id===id); if(s){ s.statut = s.statut==='fait'?'a_faire':'fait'; save(); } }
function duplicateSeance(id, newDate){
  const s = STORE.data.seances.find(x=>x.id===id);
  if(!s) return;
  const copy = JSON.parse(JSON.stringify(s));
  copy.id = uid(); copy.statut='a_faire'; if(newDate) copy.date=newDate;
  STORE.data.seances.push(copy); save();
  return copy;
}
function duplicateWeek(fromStart, toStart){
  const days = activeDays();
  days.forEach(dayIdx=>{
    const iso = isoDate(addDays(fromStart, dayIdx));
    const toISO = isoDate(addDays(toStart, dayIdx));
    STORE.data.seances.filter(s=>s.date===iso).forEach(s=>duplicateSeance(s.id, toISO));
  });
}
function generateWeekFromEDT(weekStart){
  const days = activeDays();
  days.forEach(dayIdx=>{
    const iso = isoDate(addDays(weekStart, dayIdx));
    const slots = STORE.data.creneaux.filter(c=>c.jour===dayIdx && !PAUSE_MATIERES.includes(c.matiere));
    slots.forEach(slot=>{
      const exists = STORE.data.seances.some(s=>s.date===iso && s.creneauId===slot.id);
      if(!exists){
        STORE.data.seances.push({
          id: uid(), date: iso, creneauId: slot.id, matiere: slot.matiere,
          heureDebut: slot.heureDebut, heureFin: slot.heureFin,
          domaine:'', sousDomaine:'', objectifs:[], description: slot.label ? `<p><strong>${esc(slot.label)}</strong></p>` : '',
          deroulement:'', materiel:'', niveauCible:'commun', ateliers:[], statut:'a_faire', pieces:[], ficheId:''
        });
      }
    });
  });
  save();
}

  function refreshSdom(){ sdomSel.innerHTML = '<option value="">—</option>'+sousDomainesFor(cycleSel.value, matSel.value, domSel.value).map(d=>`<option ${d===s.sousDomaine?'selected':''}>${d}</option>`).join(''); refreshObjs(); }
  function refreshObjs(){
    const objs = objectifsFor(cycleSel.value, matSel.value, domSel.value, sdomSel.value);

  }
  cycleSel.addEventListener('change', refreshMat);
  matSel.addEventListener('change', refreshDom);
  domSel.addEventListener('change', refreshSdom);
  sdomSel.addEventListener('change', refreshObjs);
  refreshMat();

  $('#s-apply-fiche').addEventListener('click', ()=>{
    const fiche = STORE.data.fiches.find(f=>f.id===$('#s-fiche').value);
    if(!fiche){ alert('Choisissez une fiche.'); return; }
    if(fiche.matiere){ // try set matière if present in list
      const opts = Array.from(matSel.options).map(o=>o.value);
      if(opts.includes(fiche.matiere)){ matSel.value = fiche.matiere; s.matiere = fiche.matiere; refreshDom(); }
    }
    if(fiche.domaine){ s.domaine = fiche.domaine; refreshDom(); }
    if(fiche.objectifs){
      const existing = $$('#s-objs input').map(i=>i.value);
      // leave checkboxes; put text into description
    }
    const phases = (fiche.phases||[]).map(p=>`<li><strong>${esc(p.titre||'')}</strong> ${p.duree?'('+esc(p.duree)+')':''} — ${esc(p.description||'')}</li>`).join('');
    $('#s-desc').innerHTML = (fiche.objectifs?`<p><em>Objectifs :</em> ${esc(fiche.objectifs)}</p>`:'') + (phases?`<ul>${phases}</ul>`:'') + (fiche.differenciation?`<p><em>Différenciation :</em> ${esc(fiche.differenciation)}</p>`:'');
    if(fiche.materiel) $('#s-materiel').value = fiche.materiel;
  });

  function ateliersRow(a){
    a = a || {nom:'',type:'dirigé',groupe:'',rotation:''};
    return `<div class="atelier-row">
      <div><label>Nom</label><input type="text" class="at-nom" value="${esc(a.nom)}"></div>
      <div><label>Type</label><select class="at-type"><option ${a.type==='dirigé'?'selected':''}>dirigé</option><option ${a.type==='semi-dirigé'?'selected':''}>semi-dirigé</option><option ${a.type==='autonome'?'selected':''}>autonome</option></select></div>
      <div><label>Groupe / rotation</label><input type="text" class="at-groupe" value="${esc(a.groupe)}" placeholder="ex : groupe rouge, 10 min"></div>
      <button type="button" class="btn btn-sm btn-danger" data-rm-atelier>✕</button>
    </div>`;
  }
  const ateliersWrap = $('#s-ateliers');
  (s.ateliers&&s.ateliers.length? s.ateliers : []).forEach(a=> ateliersWrap.insertAdjacentHTML('beforeend', ateliersRow(a)));
  $('#s-add-atelier').addEventListener('click', ()=> ateliersWrap.insertAdjacentHTML('beforeend', ateliersRow()));
  ateliersWrap.addEventListener('click', e=>{ if(e.target.matches('[data-rm-atelier]')) e.target.closest('.atelier-row').remove(); });
  function readAteliers(){ return $$('.atelier-row', ateliersWrap).map(r=>({ nom:$('.at-nom',r).value, type:$('.at-type',r).value, groupe:$('.at-groupe',r).value })); }

  function pieceRow(p){ p = p||{label:'',url:''}; return `<div class="row" style="margin-bottom:6px;"><input type="text" class="pi-label" placeholder="Libellé" value="${esc(p.label)}" style="flex:1;"><input type="text" class="pi-url" placeholder="Lien (URL)" value="${esc(p.url)}" style="flex:2;"><button type="button" class="btn btn-sm btn-danger" data-rm-piece>✕</button></div>`; }
  const piecesWrap = $('#s-pieces');
  (s.pieces||[]).forEach(p=> piecesWrap.insertAdjacentHTML('beforeend', pieceRow(p)));
  $('#s-add-piece').addEventListener('click', ()=> piecesWrap.insertAdjacentHTML('beforeend', pieceRow()));
  piecesWrap.addEventListener('click', e=>{ if(e.target.matches('[data-rm-piece]')) e.target.closest('.row').remove(); });
  function readPieces(){ return $$('.row', piecesWrap).filter(r=>$('.pi-label',r)).map(r=>({label:$('.pi-label',r).value, url:$('.pi-url',r).value})).filter(p=>p.label||p.url); }

  if(isEdit){ const dup = document.getElementById('s-dup'); if(dup) dup.addEventListener('click', ()=>{ duplicateSeance(seance.id); closeModal(); render(); }); }
}

  if(!STORE.data.programmations.length){
    tbody.innerHTML = `<tr><td colspan="${PERIODES.length+1}"><div class="empty"><div class="big">📈</div>Aucune programmation. Clique sur « + Ajouter ».</div></td></tr>`;

      return `<tr><td><strong>${esc(m)}</strong></td>${PERIODES.map(per=>{

    const p = STORE.data.programmations.find(x=>x.id===cb.dataset.prog); p.statut = cb.checked?'fait':'prevu'; save();

  $$('[data-edit-prog]', root).forEach(b=> b.addEventListener('click', ()=> openProgModal(STORE.data.programmations.find(x=>x.id===b.dataset.editProg))));

function openProgModal(item){
  const isEdit = !!item;
  const cycleGuess = STORE.data.config.cycleDefaut || cycleFromNiveaux(STORE.data.config.niveaux);
  const p = item || { matiere:'', periode:'Période 1', objectifs:'', statut:'prevu', cycle: cycleGuess, domaine:'', sousDomaine:'' };
  const body = `
    <div class="field"><label>Cycle</label><select id="p-cycle">${CYCLES.map(c=>`<option ${(p.cycle||cycleGuess)===c?'selected':''}>${c}</option>`).join('')}</select></div>

      <div class="field"><label>Matière</label><select id="p-mat"></select></div>

    </div>
    <div class="field"><label>Objectifs du référentiel</label><div id="p-objs" style="max-height:140px;overflow-y:auto;border:1px solid var(--border);border-radius:7px;padding:8px;"></div></div>
    <div class="two-col">
      <div class="field"><label>Période</label><select id="p-per">${PERIODES.map(per=>`<option ${per===p.periode?'selected':''}>${per}</option>`).join('')}</select></div>
      <div class="field"><label>Libellé complémentaire</label><input type="text" id="p-extra" value="${esc(p.extra||'')}" placeholder="Précision libre (optionnel)"></div>
    </div>
  `;
  const footExtra = isEdit? `<button class="btn btn-danger" id="p-del">Supprimer</button>`:'';
  openModal(isEdit?'Programmation':'Nouvelle programmation', body, footExtra, ()=>{
    const selected = $$('#p-objs input:checked').map(i=>i.value);
    const extra = $('#p-extra').value.trim();
    const objectifs = [...selected, extra].filter(Boolean).join(' · ') || $('#p-mat').value;
    const payload = {
      matiere:$('#p-mat').value, periode:$('#p-per').value, objectifs,
      statut:p.statut||'prevu', cycle:$('#p-cycle').value,
      domaine:$('#p-dom').value, sousDomaine:$('#p-sdom').value, extra
    };
    if(isEdit) Object.assign(item,payload); else STORE.data.programmations.push(Object.assign({id:uid()},payload));
    save(); render(); return true;
  }, isEdit? ()=>{ if(confirm('Supprimer ?')){ STORE.data.programmations = STORE.data.programmations.filter(x=>x.id!==item.id); save(); closeModal(); render(); } } : null, 'p-del');

  const cycleSel = $('#p-cycle'), matSel = $('#p-mat'), domSel = $('#p-dom'), sdomSel = $('#p-sdom');
  function refreshMat(){ const mats = matieresFor(cycleSel.value); matSel.innerHTML = mats.map(m=>`<option ${m===(p.matiere||mats[0])?'selected':''}>${m}</option>`).join(''); refreshDom(); }
  function refreshDom(){ domSel.innerHTML = '<option value="">—</option>'+domainesFor(cycleSel.value, matSel.value).map(d=>`<option ${d===p.domaine?'selected':''}>${d}</option>`).join(''); refreshSdom(); }
  function refreshSdom(){ sdomSel.innerHTML = '<option value="">—</option>'+sousDomainesFor(cycleSel.value, matSel.value, domSel.value).map(d=>`<option ${d===p.sousDomaine?'selected':''}>${d}</option>`).join(''); refreshObjs(); }
  function refreshObjs(){
    const objs = objectifsFor(cycleSel.value, matSel.value, domSel.value, sdomSel.value);
    const selected = (p.objectifs||'').split(' · ');
    $('#p-objs').innerHTML = objs.length? objs.map(o=>`<label style="display:block;font-size:12.5px;font-weight:400;margin-bottom:4px;"><input type="checkbox" value="${esc(o)}" ${selected.includes(o)?'checked':''} style="width:auto;margin-right:6px;">${esc(o)}</label>`).join('') : '<div class="hint">Sélectionnez un sous-domaine pour voir les objectifs.</div>';
  }
  cycleSel.addEventListener('change', refreshMat);
  matSel.addEventListener('change', refreshDom);
  domSel.addEventListener('change', refreshSdom);
  sdomSel.addEventListener('change', refreshObjs);
  refreshMat();
}

   ========================================================= */
let elevesTab = 'liste';
function renderEleves(root){
  $('#page-actions').innerHTML = `<button class="btn btn-primary" id="btn-add-eleve">+ Ajouter un élève</button>`;
  root.innerHTML = `
    <div class="row" style="margin-bottom:14px;">
      <button class="btn btn-sm" data-tab="liste">Liste</button>
      <button class="btn btn-sm" data-tab="trombi">Trombinoscope</button>
      <button class="btn btn-sm" data-tab="appel">Registre d'appel</button>
    </div>
    <div id="eleves-body"></div>
  `;
  $$('[data-tab]', root).forEach(b=> b.addEventListener('click', ()=>{ elevesTab=b.dataset.tab; renderElevesBody(); }));
  renderElevesBody();
  $('#btn-add-eleve').addEventListener('click', ()=> openEleveModal());

  function renderElevesBody(){
    const body = $('#eleves-body', root);
    $$('[data-tab]', root).forEach(b=> b.classList.toggle('btn-primary', b.dataset.tab===elevesTab));
    const eleves = STORE.data.eleves.slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
    if(!eleves.length){ body.innerHTML = `<div class="empty"><div class="big">🧒</div>Aucun élève enregistré.</div>`; return; }
    if(elevesTab==='liste'){
      body.innerHTML = `<div class="card">${eleves.map(e=>`
        <div class="list-item" data-eleve="${e.id}" style="cursor:pointer;">
          ${e.photo?`<img class="avatar" src="${e.photo}">`:`<div class="avatar">${(e.prenom[0]||'')+(e.nom[0]||'')}</div>`}
          <div><strong>${esc(e.prenom)} ${esc(e.nom)}</strong><div style="font-size:11.5px;color:var(--text-muted);">${esc(e.niveau||'')}</div></div>
        </div>`).join('')}</div>`;
      $$('[data-eleve]', body).forEach(el=> el.addEventListener('click', ()=> openEleveModal(eleves.find(e=>e.id===el.dataset.eleve))));
    } else if(elevesTab==='trombi'){
      body.innerHTML = `<div class="trombi">${eleves.map(e=>`
        <div class="card tcard" data-eleve="${e.id}" style="cursor:pointer;">
          ${e.photo?`<img class="avatar" src="${e.photo}">`:`<div class="avatar">${(e.prenom[0]||'')+(e.nom[0]||'')}</div>`}
          <div style="font-weight:600;font-size:12.5px;">${esc(e.prenom)}</div><div style="font-size:11px;color:var(--text-muted);">${esc(e.niveau||'')}</div>
        </div>`).join('')}</div>`;
      $$('[data-eleve]', body).forEach(el=> el.addEventListener('click', ()=> openEleveModal(eleves.find(e=>e.id===el.dataset.eleve))));
    } else {
      const today = isoDate(new Date());
      body.innerHTML = `<div class="card card-pad">
        <div class="field" style="max-width:220px;"><label>Date</label><input type="date" id="appel-date" value="${today}"></div>
        <div id="appel-list"></div>
      </div>`;
      const dateInput = $('#appel-date', body);
      function drawAppel(){
        const d = dateInput.value;
        $('#appel-list', body).innerHTML = eleves.map(e=>{
          const p = STORE.data.presences.find(x=>x.eleveId===e.id && x.date===d);
          const statut = p? p.statut : 'present';
          return `<div class="list-item">
            <div style="flex:1;">${esc(e.prenom)} ${esc(e.nom)}</div>
            <select data-appel="${e.id}">
              <option value="present" ${statut==='present'?'selected':''}>Présent</option>
              <option value="absent" ${statut==='absent'?'selected':''}>Absent</option>
              <option value="retard" ${statut==='retard'?'selected':''}>Retard</option>
            </select>
          </div>`;
        }).join('');
        $$('[data-appel]', body).forEach(sel=> sel.addEventListener('change', ()=>{
          const d2 = dateInput.value; const eid = sel.dataset.appel;
          let p = STORE.data.presences.find(x=>x.eleveId===eid && x.date===d2);
          if(!p){ p = {id:uid(), eleveId:eid, date:d2, statut:sel.value}; STORE.data.presences.push(p); }
          else p.statut = sel.value;
          save();
        }));
      }
      dateInput.addEventListener('change', drawAppel);
      drawAppel();
    }
  }
}
function openEleveModal(eleve){
  const isEdit = !!eleve;
  const e = eleve || { nom:'', prenom:'', niveau: STORE.data.config.niveaux[0]||'', photo:'' };
  const body = `
    <div class="two-col">
      <div class="field"><label>Prénom</label><input type="text" id="e-prenom" value="${esc(e.prenom)}"></div>
      <div class="field"><label>Nom</label><input type="text" id="e-nom" value="${esc(e.nom)}"></div>
    </div>
    <div class="field"><label>Niveau</label><select id="e-niveau">${STORE.data.config.niveaux.map(n=>`<option ${n===e.niveau?'selected':''}>${n}</option>`).join('')}</select></div>

  `;
  const footExtra = isEdit? `<button class="btn btn-danger" id="e-del">Supprimer</button>`:'';
  let photoData = e.photo;
  openModal(isEdit?'Élève':'Nouvel élève', body, footExtra, ()=>{
    const payload = { prenom:$('#e-prenom').value, nom:$('#e-nom').value, niveau:$('#e-niveau').value, photo: photoData };
    if(isEdit) Object.assign(eleve,payload); else STORE.data.eleves.push(Object.assign({id:uid()},payload));
    save(); render(); return true;
  }, isEdit? ()=>{ if(confirm('Supprimer cet élève ?')){ STORE.data.eleves = STORE.data.eleves.filter(x=>x.id!==eleve.id); save(); closeModal(); render(); } } : null, 'e-del');
  $('#e-photo').addEventListener('change', ev=>{

}

    <div class="card">${list.length? list.map(r=>`
      <div class="list-item" data-rdv="${r.id}" style="cursor:pointer;">
        <div style="flex:1;"><strong>${esc(r.titre)}</strong><div class="hint">${fmtShort(new Date(r.date+'T12:00:00'))}${r.heure?' · '+esc(r.heure):''} · ${esc(r.categorie||'')}</div></div>
        <span class="chip">${esc(String(r.duree||0))} min</span>
      </div>`).join('') : `<div class="empty"><div class="big">📌</div>Aucun rendez-vous. Ajoutez APC, conseils, formations…</div>`}</div>
  `;
  $('#btn-add-rdv').addEventListener('click', ()=>openRdvModal());
  $$('[data-rdv]', root).forEach(el=> el.addEventListener('click', ()=> openRdvModal(STORE.data.rdv.find(r=>r.id===el.dataset.rdv))));
}
function openRdvModal(rdv){
  const isEdit = !!rdv;
  const r = rdv || { titre:'', date: isoDate(new Date()), heure:'17:00', duree:60, categorie:'Réunion parents', notes:'' };
  const body = `
    <div class="field"><label>Titre</label><input type="text" id="r-titre" value="${esc(r.titre)}"></div>
    <div class="two-col">
      <div class="field"><label>Date</label><input type="date" id="r-date" value="${r.date}"></div>
      <div class="field"><label>Heure</label><input type="time" id="r-heure" value="${esc(r.heure||'')}"></div>
    </div>
    <div class="two-col">
      <div class="field"><label>Catégorie</label><select id="r-cat">${PLANNER_CATS.map(c=>`<option ${c===(r.categorie||'')?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Durée (minutes)</label><input type="number" id="r-duree" min="0" step="15" value="${Number(r.duree||0)}"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="r-notes" rows="2">${esc(r.notes||'')}</textarea></div>
  `;
  const footExtra = isEdit? `<button class="btn btn-danger" id="r-del">Supprimer</button>`:'';
  openModal(isEdit?'Rendez-vous':'Nouveau rendez-vous', body, footExtra, ()=>{
    const payload = { titre:$('#r-titre').value, date:$('#r-date').value, heure:$('#r-heure').value, duree:Number($('#r-duree').value||0), categorie:$('#r-cat').value, notes:$('#r-notes').value };
    if(isEdit) Object.assign(rdv, payload); else STORE.data.rdv.push(Object.assign({id:uid()}, payload));
    save(); render(); return true;
  }, isEdit? ()=>{ if(confirm('Supprimer ce rendez-vous ?')){ STORE.data.rdv = STORE.data.rdv.filter(x=>x.id!==rdv.id); save(); closeModal(); render(); } } : null, 'r-del');
}

/* =========================================================
   PARAMÈTRES
   ========================================================= */
function renderParametres(root){
  const cfg = STORE.data.config;
  const allNiveaux = ['TPS','PS','MS','GS','CP','CE1','CE2','CM1','CM2'];
  root.innerHTML = `
    <div class="card card-pad" style="max-width:720px;">
      <div class="field"><label>Nom de la classe</label><input type="text" id="cfg-nom" value="${esc(cfg.classeNom||'')}"></div>
      <div class="field"><label>Niveaux (multi-niveaux possible)</label>
        <div class="row" style="flex-wrap:wrap;">${allNiveaux.map(n=>`<label style="font-weight:400;margin-right:10px;"><input type="checkbox" class="cfg-niv" value="${n}" ${(cfg.niveaux||[]).includes(n)?'checked':''} style="width:auto;margin-right:4px;">${n}</label>`).join('')}</div>
      </div>
      <div class="field"><label>Cycle par défaut (référentiel)</label>
        <select id="cfg-cycle">${CYCLES.map(c=>`<option ${c===(cfg.cycleDefaut||'')?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Jours travaillés</label>
        <div class="row" style="flex-wrap:wrap;">${DAYS_ALL.map((d,i)=>`<label style="font-weight:400;margin-right:10px;"><input type="checkbox" class="cfg-jour" value="${i}" ${(cfg.joursTravailles||[0,1,2,3,4]).includes(i)?'checked':''} style="width:auto;margin-right:4px;">${d}</label>`).join('')}</div>
      </div>
      <div class="three-col">
        <div class="field"><label>Début de journée</label><input type="time" id="cfg-debut" value="${esc(cfg.heureDebut||'08:30')}"></div>
        <div class="field"><label>Fin de journée</label><input type="time" id="cfg-fin" value="${esc(cfg.heureFin||'16:30')}"></div>
        <div class="field"><label>Pas des créneaux</label><select id="cfg-step">${[15,20,30,60].map(s=>`<option value="${s}" ${Number(cfg.slotStep)===s?'selected':''}>${s} min</option>`).join('')}</select></div>
      </div>
      <div class="row"><button class="btn btn-primary" id="cfg-save">Enregistrer</button><span class="spacer"></span><span class="hint" id="cfg-msg"></span></div>
    </div>
  `;
  $('#cfg-save').addEventListener('click', ()=>{
    const niveaux = $$('.cfg-niv:checked').map(i=>i.value);
    const jours = $$('.cfg-jour:checked').map(i=>Number(i.value)).sort((a,b)=>a-b);
    if(!niveaux.length){ alert('Choisissez au moins un niveau.'); return; }
    if(!jours.length){ alert('Choisissez au moins un jour travaillé.'); return; }
    cfg.classeNom = $('#cfg-nom').value.trim() || 'Ma classe';
    cfg.niveaux = niveaux;
    cfg.joursTravailles = jours;
    cfg.heureDebut = $('#cfg-debut').value;
    cfg.heureFin = $('#cfg-fin').value;
    cfg.slotStep = Number($('#cfg-step').value);
    cfg.cycleDefaut = $('#cfg-cycle').value || cycleFromNiveaux(niveaux);
    if(STORE.data.classes && STORE.data.classes[0]){
      STORE.data.classes[0].nom = cfg.classeNom;
      STORE.data.classes[0].niveaux = niveaux.slice();
    }
    save();
    $('#cfg-msg').textContent = 'Paramètres enregistrés.';
    renderNav();
  });
  $('#cfg-cycle').addEventListener('change', ()=>{});
  $$('.cfg-niv').forEach(cb=> cb.addEventListener('change', ()=>{
    const niveaux = $$('.cfg-niv:checked').map(i=>i.value);
    if(niveaux.length) $('#cfg-cycle').value = cycleFromNiveaux(niveaux);
  }));
}
function printEDT(){
  const days = activeDays();
  const {start:SLOT_START, end:SLOT_END, step:SLOT_STEP} = edtBounds();
  const rows = [];
  for(let m=SLOT_START;m<SLOT_END;m+=SLOT_STEP) rows.push(m);
  const vol = computeVolumeHoraire();
  let html = `<h1>Emploi du temps — ${esc(STORE.data.config.classeNom)}</h1>
  <p>Volume horaire pédagogique : <strong>${formatDuree(vol.total)}</strong></p>
  <table class="tbl" style="width:100%;"><thead><tr><th></th>${days.map(d=>`<th>${dayLabel(d)}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(m=>{
    html += `<tr><td>${minsToLabel(m)}</td>`;
    days.forEach(dayIdx=>{
      const slot = STORE.data.creneaux.find(c=>c.jour===dayIdx && toMin(c.heureDebut)===m);
      const overlapped = !slot && STORE.data.creneaux.some(c=>c.jour===dayIdx && toMin(c.heureDebut)<m && toMin(c.heureFin)>m);
      if(overlapped){ html += ''; return; }
      const rowspan = slot ? Math.max(1, Math.round((toMin(slot.heureFin)-toMin(slot.heureDebut))/SLOT_STEP)) : 1;
      html += `<td ${slot&&rowspan>1?`rowspan="${rowspan}"`:''} style="${slot?`background:${colorFor(slot.matiere)}22;`:''}">${slot?esc(slot.matiere)+(slot.label?'<br><small>'+esc(slot.label)+'</small>':''):''}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  doPrint(html);
}
function printJournal(weekStart){
  const days = activeDays();
  let html = `<h1>Cahier journal — semaine du ${fmtShort(weekStart)} — ${esc(STORE.data.config.classeNom)}</h1>`;
  days.forEach(dayIdx=>{
    const date = addDays(weekStart, dayIdx); const iso = isoDate(date);
    const list = STORE.data.seances.filter(s=>s.date===iso).sort(seanceSort);
    html += `<h2 style="margin-top:18px;">${dayLabel(dayIdx)} ${fmtShort(date)}</h2>`;
    if(!list.length){ html += `<p style="color:#888;">Aucune séance</p>`; }
    list.forEach(s=>{
      html += `<div style="border:1px solid #ccc;border-left:5px solid ${colorFor(s.matiere)};border-radius:6px;padding:8px 12px;margin-bottom:8px;">
        <strong>${esc(s.matiere)}</strong> ${(s.heureDebut&&s.heureFin)?`(${s.heureDebut}–${s.heureFin})`:''} ${s.domaine?'— '+esc(s.domaine):''} ${s.sousDomaine?'— '+esc(s.sousDomaine):''}
        ${s.materiel?`<div style="font-size:12px;margin-top:4px;"><em>Matériel :</em> ${esc(s.materiel)}</div>`:''}
        ${s.objectifs&&s.objectifs.length?`<div style="font-size:12px;margin-top:4px;"><em>Objectifs :</em> ${s.objectifs.map(esc).join(' ; ')}</div>`:''}
        <div style="font-size:12.5px;margin-top:6px;">${s.description||''}</div>
        ${s.ateliers&&s.ateliers.length? `<div style="font-size:12px;margin-top:6px;"><em>Ateliers :</em> ${s.ateliers.map(a=>esc(a.nom)+' ('+esc(a.type)+(a.groupe?', '+esc(a.groupe):'')+')').join(' — ')}</div>`:''}
      </div>`;
    });
  });
  doPrint(html);
}
function doPrint(html){
  $('#print-area').innerHTML = html;
  window.print();
}

/* =========================================================
   BOOTSTRAP
   ========================================================= */
function waitSupabase(ms){
  if(window.__supabaseReady && window.__supabase) return Promise.resolve(true);
  return new Promise((resolve)=>{
    const done = (ok)=>{ window.clearTimeout(tid); window.removeEventListener('supabase-ready', onReady); resolve(ok); };
    const onReady = ()=> done(true);
    const tid = window.setTimeout(()=> done(false), ms);
    window.addEventListener('supabase-ready', onReady, { once:true });
  });
}
async function bootstrap(){
  // Attendre le client Supabase (max 3s) — sinon mode hors ligne
  const cloudOk = await waitSupabase(3000);
  if(!cloudOk){
    console.warn('[cahier] Supabase indisponible — mode hors ligne');
    window.__supabaseReady = false;
  }
  loadLocalCache();
  await initGate();
  $('#btn-export-json').addEventListener('click', exportJSON);
  $('#btn-import-json').addEventListener('click', ()=> $('#file-import').click());
  $('#file-import').addEventListener('change', e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; });
  $('#btn-logout').addEventListener('click', logout);
  $('#menu-toggle')?.addEventListener('click', ()=>{
    $('#sidebar').classList.toggle('open');
    $('#sidebar-backdrop').classList.toggle('show');
  });
  $('#sidebar-backdrop')?.addEventListener('click', closeMobileNav);
}
document.addEventListener('DOMContentLoaded', bootstrap);
})();
